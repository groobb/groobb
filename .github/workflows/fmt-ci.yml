name: Formatter

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.css"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.md"
      - "**/*.toml"
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.css"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.md"
      - "**/*.toml"

env:
  GO_VERSION: "1.26.3"

jobs:
  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm fmt:check

  # koryluslintの `md` サブコマンドでMarkdownの句点改行を検査する。
  # koryluslintはgo/go.modのtoolディレクティブで固定し、公開モジュール
  # github.com/korylus/toolsから取得する。
  #
  # 検査はPRのベースとの差分行 (`-base`) に限定するため、触っていない既存Markdownは
  # 指摘されない。したがってpull request時のみ実行し、fetch-depth: 0で差分に必要な
  # ベースブランチを取得する。
  prose:
    name: Markdown prose (koryluslint md)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # ルートMakefileのlint-md-baseターゲット経由でmdを実行し、固定版
      # koryluslintをビルドしてリポジトリルートのMarkdownをPRのベースとの差分で
      # 走査する。mdがgo toolではなくビルド済みバイナリを要する理由はルートMakefileを参照。
      - name: Run koryluslint md (changed lines)
        run: make lint-md-base BASE=origin/${{ github.base_ref }}

name: Go CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

env:
  GO_VERSION: "1.26.3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # 作業ツリーを書き換えない検査は、書き換えるステップより前に実行する。
      # `make templ-generate` は `goimports -w .` でツリー全体を整形するため、
      # その後ろにgoimportsのチェックを置くと整形済みのツリーしか見ず、
      # 手書きファイルのimportの崩れを報告できない。
      - name: Check goimports
        run: make goimports-check

      - name: Check sqlc generate
        run: make sqlc-diff

      - name: Check templ generate
        run: |
          make templ-generate
          git diff --exit-code internal/templates/

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: go
          args: --config=.golangci.yml ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build

      - name: Check binary exists
        run: |
          if [ ! -f bin/groobb ]; then
            echo "Build failed: binary not found"
            exit 1
          fi

  # koryluslintの `comment` サブコマンドで、日本語テキストがkorylus-lang.md §3のスタイルに沿っているかを検査する。
  # koryluslintはgo.modのtoolディレクティブで固定し、公開モジュールgithub.com/korylus/toolsから取得する。
  # pushとpull requestのどちらでも、差分に限らずツリー全体を検査する。
  comment-lint:
    name: Comment lint (koryluslint comment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check Japanese text style
        run: make lint-style

name: Go CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

env:
  GO_VERSION: "1.26.3"
  # Pin golangci-lint to the version Dockerfile.dev builds, so local and CI lint
  # with the same rules.
  # [Ja] golangci-lint を Dockerfile.dev がビルドするバージョンに固定し、ローカルと
  # CI が同じルールで lint するようにする。
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check templ generate
        run: |
          make templ-generate
          git diff --exit-code internal/templates/

      - name: Check goimports
        run: make goimports-check

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Build golangci-lint from source with the CI Go toolchain instead of using
      # the prebuilt binary. golangci-lint refuses to analyze a module whose go
      # directive targets a newer Go than the one it was built with, and the
      # published binaries lag behind go 1.26.3. This mirrors Dockerfile.dev so
      # local and CI run the same version.
      #
      # [Ja] golangci-lint を配布バイナリではなく CI の Go ツールチェーンでソースから
      # ビルドする。golangci-lint は自身のビルドに使われた Go より新しい go ディレク
      # ティブを持つ module の解析を拒否し、配布バイナリは go 1.26.3 への追従が遅れる。
      # Dockerfile.dev に揃え、ローカルと CI で同じバージョンを動かす。
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run golangci-lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/groobb_test?sslmode=disable
      GROOBB_PORT: "8080"

    services:
      postgresql:
        image: postgres:18.3
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: groobb_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get dependencies
        run: go mod download

      - name: Setup test database
        run: make db-setup-test

      - name: Run tests
        run: make test
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build

      - name: Check binary exists
        run: |
          if [ ! -f bin/server ]; then
            echo "Build failed: binary not found"
            exit 1
          fi

  # Lint code-comment [Ja] markers with koryluslint's `comment` subcommand.
  # koryluslint is pinned via the `tool` directive in go.mod and fetched from the
  # public module github.com/korylus/tools.
  #
  # Two steps mirror the subcommand's two modes (following Annict's commentlint
  # CI): the whole-tree scan runs always (the [Ja]-on-non-Japanese misuse), and
  # the marker-placement rules run on pull requests only, limited to the lines
  # added against the PR base (`-base`). fetch-depth: 0 makes the base available.
  #
  # [Ja] koryluslint の `comment` サブコマンドでコードコメントの [Ja] マーカーを
  # 検査する。koryluslint は go.mod の tool ディレクティブで固定し、公開モジュール
  # github.com/korylus/tools から取得する。
  #
  # 2 ステップはサブコマンドの 2 モードに対応する (Annict の commentlint CI に倣う)。
  # 全体走査 ([Ja] が日本語を含まない行に付く誤用) は常時実行し、マーカー配置の規則は
  # pull request 時のみ PR のベースに対する追加行 (`-base`) に限定して実行する。
  # fetch-depth: 0 で差分に必要なベースを取得する。
  comment-lint:
    name: Comment lint (koryluslint comment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check bilingual comments (whole tree)
        run: go tool koryluslint comment

      - name: Check bilingual comments (added lines)
        if: github.event_name == 'pull_request'
        run: go tool koryluslint comment -base=origin/${{ github.base_ref }}

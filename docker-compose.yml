services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    depends_on:
      - caddy
      - postgresql
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/.cache/go-build
    ports:
      - "4300:8080" # Go
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

  caddy:
    image: caddy:2-alpine
    ports:
      - "4301:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  postgresql:
    image: postgres:18.3
    ports:
      - "4302:5432"
    volumes:
      # Postgres 18+ stores data in a major-version-specific subdirectory and
      # expects the volume at /var/lib/postgresql, not the pre-18 location
      # /var/lib/postgresql/data. Mounting the legacy path makes the image treat
      # the existing cluster as an unused mount and refuse to start.
      # https://github.com/docker-library/postgres/pull/1259
      #
      # [Ja] Postgres 18 以降はデータをメジャーバージョン別のサブディレクトリに
      # 格納し、ボリュームは /var/lib/postgresql に置くことを前提とする (18 以前の
      # /var/lib/postgresql/data ではない)。旧パスにマウントすると、イメージは
      # 既存クラスタを未使用マウントとみなして起動を拒否する。
      - postgresql18-data:/var/lib/postgresql:delegated
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  go-build-cache:
  go-mod-cache:
  postgresql18-data:

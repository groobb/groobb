# `groobb seed` が作成する開発用アカウントの名簿。実際に使う名簿は個人のメール
# アドレスを持つためバージョン管理には入れず、代わりに本ファイルをコミットしている。
# シードを使えるようにするには、本ファイルを .gitignoreが除外している
# go/seed-users.tomlへコピーし、アドレスを自分がメールを読めるものへ置き換える。
#
# どのアカウントもサインインはパスワードだけで完了する。ブラウザ確認は単一ステップの
# サインインを通るため、2要素認証を有効にしたアカウントはそれを止めてしまう。それぞれの
# 役割が何のためにあるのかは、生成器がそれを名指ししているinternal/seed/user.goに
# 書いてある。

# passwordは以下のすべてのアカウントで共通。シードは開発環境以外での実行を拒否し、
# devサイト自体もBasic認証の内側にあるため、アカウントごとに別のパスワードを持たせても
# 得るものが無い。
password = "password"

# スレッドを立てるアカウントで、別の役割を指定しない限りブラウザ確認がサインイン
# するアカウント。
[[users]]
role = "starter"
atname = "seeduser1"
email = "seeduser1@example.com"
note = "掲示板に並ぶスレッドを立てる。既定でサインインするアカウント"

# 自分が立てたのではないスレッドに返信するアカウント。スレッドが、1人が書き続けて
# いるものではなく会話として読めるようになるのはこのアカウントによる。
[[users]]
role = "replier"
atname = "seeduser2"
email = "seeduser2@example.com"
note = ">>Nで返信し、投稿を被参照とあわせて確認できるようにする"

# コミュニティを管理するアカウント。シードの完了時点でadminロールを持つため、
# 先に誰かを任命しなくても管理画面を開ける。他のアカウントは一般の利用者のままになる。
[[users]]
role = "admin"
atname = "seeduser4"
email = "seeduser4@example.com"
note = "adminロールを持ち、管理画面を開けるようにする"

# 投稿を作者抜きで眺めるためのアカウント。退会は書かれたものをその場に残し、名前だけを
# 外す。
[[users]]
role = "withdrawn"
atname = "seeduser3"
email = "seeduser3@example.com"
note = "退会し、作者のいなくなった投稿を確認できるようにする"

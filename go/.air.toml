root = "."
tmp_dir = "tmp"

[build]
# templコードを再生成してからコンパイルする。op runはバイナリ実行時 (起動時に
# データベースへpingする) にのみ必要でコンパイルには不要なため、cmdではなく
# full_binで包む。CIはairを使わないため、op run依存はローカル限定。
cmd = "make templ-generate && go build -o ./tmp/main ./cmd/groobb"
bin = "./tmp/main"
full_bin = "APP_ENV=dev op run --env-file=.env -- ./tmp/main serve"
delay = 1000
# static/ を監視対象に含め、css / jsを監視する拡張子に含めるのは、バイナリが
# アセットを埋め込むためである。ビルドし直されたstyle.cssは、その周りのサーバーが
# ビルドし直されて初めてブラウザに届く。
exclude_dir = ["bin", "data", "db", "node_modules", "tmp", "vendor", "web"]
exclude_regex = ["_test.go", "_templ\\.go$"]
include_ext = ["css", "go", "js", "sql", "templ", "toml"]
stop_on_error = true

[misc]
clean_on_exit = false

root = "."
tmp_dir = "tmp"

[build]
# Regenerate templ code, then compile. op run is only needed to run the binary
# (startup pings the database), not to compile, so it wraps full_bin instead of
# cmd. CI does not use air, so the op run dependency is local-only.
#
# [Ja] templ コードを再生成してからコンパイルする。op run はバイナリ実行時 (起動時に
# データベースへ ping する) にのみ必要でコンパイルには不要なため、cmd ではなく
# full_bin で包む。CI は air を使わないため、op run 依存はローカル限定。
cmd = "make templ-generate && go build -o ./tmp/main ./cmd/groobb"
bin = "./tmp/main"
full_bin = "APP_ENV=dev op run --env-file=.env -- ./tmp/main serve"
delay = 1000
# static/ is watched, and css / js are watched extensions, because the binary
# embeds the assets: a rebuilt style.css only reaches the browser once the server
# is rebuilt around it.
#
# [Ja] static/ を監視対象に含め、css / js を監視する拡張子に含めるのは、バイナリが
# アセットを埋め込むためである。ビルドし直された style.css は、その周りのサーバーが
# ビルドし直されて初めてブラウザに届く。
exclude_dir = ["bin", "data", "db", "node_modules", "tmp", "vendor", "web"]
exclude_regex = ["_test.go", "_templ\\.go$"]
include_ext = ["css", "go", "js", "sql", "templ", "toml"]
stop_on_error = true

[misc]
clean_on_exit = false

version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries/"
    schema: "db/schema.sql"
    gen:
      go:
        package: "query"
        out: "internal/query"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          # Use github.com/google/uuid for uuid columns (UUID base for new
          # projects, per the architecture guide), instead of pgtype.UUID.
          #
          # [Ja] uuid 型カラムには pgtype.UUID ではなく github.com/google/uuid を
          # 使う (アーキテクチャガイドに従い、新規プロジェクトは UUID ベース)。
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Map timestamptz to time.Time. All timestamps are stored as
          # TIMESTAMP WITH TIME ZONE in UTC (per the development guide).
          #
          # [Ja] timestamptz は time.Time にマップする。すべての時刻は
          # TIMESTAMP WITH TIME ZONE として UTC で保存する (開発ガイドに従う)。
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # Map the citext extension type to string. citext gives the database
          # case-insensitive comparison (e.g. users.email uniqueness); on the Go
          # side it is just a string.
          #
          # [Ja] citext 拡張型は string にマップする。citext は DB 側で大文字小文字を
          # 区別しない比較 (例: users.email の一意性) を担い、Go 側では単なる string
          # として扱う。
          - db_type: "public.citext"
            go_type: "string"
          - db_type: "public.citext"
            nullable: true
            go_type:
              type: "string"
              pointer: true

version: "2"
sql:
  - engine: "sqlite"
    queries: "db/queries/"
    # マイグレーションのディレクトリ全体をスキーマとして渡すため、マイグレーションを
    # 追加してもここを編集する必要はない。Riverのテーブルもそこにあるので、internal/query
    # にはそれぞれのモデル (RiverJob・RiverLeaderなど) が生成される。これらは生成される
    # だけで使わない。Riverは実行時にriversqliteを通して自分のテーブルを所有し、
    # アプリケーションはそれらをクエリしない。レビューで捕まえるべきなのはモデルの存在では
    # なく、それらに対するクエリを足すことのほうである。
    schema: "db/migrations/"
    gen:
      go:
        package: "query"
        out: "internal/query"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        # nullableなカラムはsql.NullTのラッパーではなくポインタで表現する。
        # 値が無い状態がドメインモデルで既に使っているnilになり、リポジトリが行を
        # 変換するときにラッパーを開く手間が無くなるため。
        emit_pointers_for_null_types: true
        overrides:
          # 時刻はカラムが保存されているのと同じ1つのテキスト書式でドライバの
          # 境界を渡す。素のtime.Timeは別の書式で束縛され、保存されたテキストとの
          # 比較が失敗せずに狂うため (sqlitetimeパッケージを参照)。
          - db_type: "DATETIME"
            go_type: "github.com/groobb/groobb/go/internal/sqlitetime.Time"
          - db_type: "DATETIME"
            nullable: true
            go_type:
              import: "github.com/groobb/groobb/go/internal/sqlitetime"
              type: "Time"
              pointer: true

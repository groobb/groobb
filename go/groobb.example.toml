# Example configuration file for a Groobb instance.
#
# Copy it to groobb.toml in the directory the server runs from, or point
# GROOBB_CONFIG_FILE at it, and fill in the values. Every setting here has a
# matching environment variable, shown above it, which overrides the file when
# it is set: keep the file for the settings an instance always has, and use the
# environment for the secrets a deployment injects.
#
# The file itself is optional. An instance configured entirely through the
# environment starts without one.
#
# [Ja] Groobb インスタンスの設定ファイルのサンプル。
#
# サーバーを実行するディレクトリに groobb.toml としてコピーするか、GROOBB_CONFIG_FILE で
# このファイルを指したうえで、値を埋めてください。ここにある設定にはそれぞれ対応する
# 環境変数があり (各設定の上に記載)、設定されている場合はファイルより優先されます。
# インスタンスが常に持つ設定はファイルに置き、デプロイ側が注入する秘密情報は環境変数を
# 使ってください。
#
# ファイル自体は任意です。環境変数だけで設定するインスタンスはファイル無しで起動します。

[app]
# The running environment: "dev", "test", or "prod". A self-hosted instance runs
# as "prod". APP_ENV overrides it.
#
# The public base URL: a scheme and a host, with no path and no trailing slash.
# The links in outgoing email and the canonical URL each public page declares
# itself by are built from it, so a wrong value sends people to the wrong host
# and tells search engines an address this instance does not serve. A value that
# is not such a URL stops startup. An instance without one starts and publishes
# neither. GROOBB_APP_URL overrides it.
#
# [Ja] 実行環境 ("dev" / "test" / "prod")。セルフホストのインスタンスは "prod" で
# 動かします。APP_ENV が上書きします。
#
# 公開ベース URL。スキームとホストだけを書き、パスも末尾スラッシュも付けません。送信メール
# 内のリンクと、公開ページがそれぞれ自身を宣言する canonical URL はこの値から組み立てられる
# ため、誤った値は受信者を別のホストへ送り、このインスタンスが配信しないアドレスを検索
# エンジンへ伝えます。その形でない値は起動を止めます。未設定でもインスタンスは起動し、
# そのときはどちらも出しません。GROOBB_APP_URL が上書きします。
env = "prod"
url = "https://groobb.example.com"

[server]
# The TCP port the HTTP server listens on. GROOBB_PORT overrides it.
#
# The networks this instance's own reverse proxies connect from, written as
# addresses or CIDR blocks. A request that arrives from one of them has its
# client address read from X-Forwarded-For; a request from anywhere else is
# attributed to the address that connected, which is what an instance exposed
# directly wants. List every hop and not only the nearest one: behind
# Cloudflare and a local Caddy that means the loopback addresses together with
# Cloudflare's ranges, or the address recorded for a visitor is Cloudflare's
# edge instead of theirs. It is empty here because the forwarding header is
# client-supplied input until a proxy that appends to it is known to be in
# front. GROOBB_TRUSTED_PROXIES overrides it, as a comma-separated list
# ("127.0.0.1,::1,10.0.0.0/8").
#
# [Ja] HTTP サーバーが待ち受ける TCP ポート。GROOBB_PORT が上書きします。
#
# このインスタンス自身のリバースプロキシが接続してくるネットワーク。アドレスか CIDR
# ブロックで書きます。そのいずれかから届いたリクエストは X-Forwarded-For から
# クライアントのアドレスを読み取り、それ以外から届いたリクエストは接続してきたアドレスの
# ものとして扱います。直接公開するインスタンスに必要なのは後者です。最も近い hop だけでなく
# すべての hop を書いてください。Cloudflare とローカルの Caddy の背後にあるなら、ループ
# バックアドレスに加えて Cloudflare のレンジも必要で、書かなければ訪問者のアドレスとして
# Cloudflare のエッジが記録されます。ここで空にしているのは、転送ヘッダーが、追記すると
# 分かっているプロキシが前段に立つまではクライアントの与えた入力に過ぎないためです。
# GROOBB_TRUSTED_PROXIES がカンマ区切りの一覧 ("127.0.0.1,::1,10.0.0.0/8") で
# 上書きします。
port = 8080
trusted_proxies = []

[database]
# The path of the SQLite database file, which holds every piece of state the
# instance keeps. It has no default so that a misconfigured instance reports
# that it does not know where its data is, instead of starting on an empty
# database of its own making. GROOBB_DATABASE_PATH overrides it.
#
# [Ja] SQLite データベースファイルのパス。インスタンスが保持する状態はすべてこのファイルに
# あります。既定値を持たないのは、設定を誤ったインスタンスが自分で作った空のデータベースの
# 上で起動するのではなく、「データの在り処が分からない」と報告するためです。
# GROOBB_DATABASE_PATH が上書きします。
path = "/var/lib/groobb/groobb.sqlite"

[security]
# The key that signs the short-lived cookies of the email-confirmation and
# two-factor sign-in flows. Generate at least 32 bytes from a cryptographically
# secure random source (`openssl rand -base64 48`) and keep it stable: changing
# it invalidates the tokens in flight, and exposing it lets an attacker forge
# authentication state. GROOBB_CONTINUATION_TOKEN_KEY overrides it.
#
# [Ja] メール確認と 2 段階認証サインインの短命 Cookie に署名する鍵。暗号学的に安全な
# 乱数源から 32 バイト以上を生成し (`openssl rand -base64 48`)、値は変えずに保ってください。
# 変更すると発行済みのトークンが無効になり、漏えいすると攻撃者が認証状態を偽造できます。
# GROOBB_CONTINUATION_TOKEN_KEY が上書きします。
continuation_token_key = ""

[email]
# The transport that delivers outgoing email: "resend" for the Resend HTTP API,
# or "smtp" for a relay. Naming "smtp" states that mail is configured, so the
# [email.smtp] settings below are then validated at startup. The From address is
# required for the SMTP transport, because a relay rejects mail with an empty
# envelope sender. GROOBB_EMAIL_PROVIDER, GROOBB_EMAIL_FROM,
# GROOBB_EMAIL_FROM_NAME, and GROOBB_RESEND_API_KEY override these.
#
# [Ja] 送信メールを配送する transport ("resend" は Resend の HTTP API、"smtp" はリレー)。
# "smtp" を指定することはメールを設定済みだという表明なので、その場合は下の [email.smtp]
# の設定を起動時に検証します。From アドレスは SMTP では必須です。エンベロープ送信者が空の
# メールはリレーに拒否されるためです。GROOBB_EMAIL_PROVIDER / GROOBB_EMAIL_FROM /
# GROOBB_EMAIL_FROM_NAME / GROOBB_RESEND_API_KEY が上書きします。
provider = "smtp"
from = "noreply@groobb.example.com"
from_name = "Groobb"
resend_api_key = ""

[email.smtp]
# The relay to send through, used when the provider above is "smtp". The port
# has no default because the right value follows from the TLS mode (465 for
# "implicit", 587 for "starttls"), and a guess would fail at delivery time
# rather than at startup. The TLS mode is "starttls", "implicit", or "none";
# "none" is only safe on a trusted local channel, since the mail carries
# sign-in and password-reset links. Leave the credentials empty for a relay that
# authorises by source address, and set both otherwise. The host is empty here
# so that a copy of this file stops at startup naming the setting, rather than
# starting on a placeholder relay whose failures surface only in the worker's
# log. GROOBB_SMTP_HOST, GROOBB_SMTP_PORT, GROOBB_SMTP_USERNAME,
# GROOBB_SMTP_PASSWORD, and GROOBB_SMTP_TLS_MODE override these.
#
# [Ja] 送信に使うリレー。上の provider が "smtp" のときに使います。ポートに既定値が無いのは、
# 適切な値が TLS モードに従って決まり ("implicit" なら 465、"starttls" なら 587)、推測した
# 値は起動時ではなく配送時に失敗するためです。TLS モードは "starttls" / "implicit" / "none"
# のいずれかで、"none" が安全なのは信頼できるローカル経路に限られます (メールはサインインと
# パスワードリセットのリンクを運ぶため)。送信元アドレスで認可するリレーでは認証情報を空に、
# それ以外では両方を設定してください。host をここで空にしているのは、このファイルをコピー
# しただけのインスタンスが、プレースホルダーのリレーで起動してワーカーのログにしか現れない
# 配送失敗を積むのではなく、設定名を挙げて起動時に止まるようにするためです。
# GROOBB_SMTP_HOST / GROOBB_SMTP_PORT / GROOBB_SMTP_USERNAME /
# GROOBB_SMTP_PASSWORD / GROOBB_SMTP_TLS_MODE が上書きします。
host = ""
port = 587
username = ""
password = ""
tls_mode = "starttls"

[turnstile]
# The Cloudflare Turnstile keys for bot protection on the public forms. With
# both empty the widget is not rendered and token verification is bypassed, so
# an instance starts before they are provisioned. The disable flag switches
# Turnstile off in a development or test environment without unsetting the keys;
# it is ignored in production. GROOBB_TURNSTILE_SITE_KEY,
# GROOBB_TURNSTILE_SECRET_KEY, and GROOBB_TURNSTILE_DISABLE override these.
#
# [Ja] 公開フォームの Bot 対策に使う Cloudflare Turnstile のキー。両方が空のときは
# ウィジェットを描画せずトークン検証もバイパスするため、キーを用意する前でもインスタンスは
# 起動します。無効化フラグは、開発・テスト環境でキーを未設定にせず Turnstile を切るための
# もので、本番では無視されます。GROOBB_TURNSTILE_SITE_KEY / GROOBB_TURNSTILE_SECRET_KEY /
# GROOBB_TURNSTILE_DISABLE が上書きします。
site_key = ""
secret_key = ""
disable = false

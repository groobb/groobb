# Groobbインスタンスの設定ファイルのサンプル。
#
# サーバーを実行するディレクトリにgroobb.tomlとしてコピーするか、GROOBB_CONFIG_FILEで
# このファイルを指したうえで、値を埋めてください。ここにある設定にはそれぞれ対応する
# 環境変数があり (各設定の上に記載)、設定されている場合はファイルより優先されます。
# インスタンスが常に持つ設定はファイルに置き、デプロイ側が注入する秘密情報は環境変数を
# 使ってください。
#
# ファイル自体は任意です。環境変数だけで設定するインスタンスはファイル無しで起動します。

[app]
# 実行環境 ("dev" / "test" / "prod")。セルフホストのインスタンスは "prod" で
# 動かします。APP_ENVが上書きします。
#
# 公開ベースURL。スキームとホストだけを書き、パスも末尾スラッシュも付けません。送信メール
# 内のリンクと、公開ページがそれぞれ自身を宣言するcanonical URLはこの値から組み立てられる
# ため、誤った値は受信者を別のホストへ送り、このインスタンスが配信しないアドレスを検索
# エンジンへ伝えます。その形でない値は起動を止めます。未設定でもインスタンスは起動し、
# そのときはどちらも出しません。GROOBB_APP_URLが上書きします。
env = "prod"
url = "https://groobb.example.com"

[server]
# HTTPサーバーが待ち受けるTCPポート。GROOBB_PORTが上書きします。
#
# このインスタンス自身のリバースプロキシが接続してくるネットワーク。アドレスかCIDR
# ブロックで書きます。そのいずれかから届いたリクエストはX-Forwarded-Forから
# クライアントのアドレスを読み取り、それ以外から届いたリクエストは接続してきたアドレスの
# ものとして扱います。直接公開するインスタンスに必要なのは後者です。最も近いhopだけでなく
# すべてのhopを書いてください。CloudflareとローカルのCaddyの背後にあるなら、ループ
# バックアドレスに加えてCloudflareのレンジも必要で、書かなければ訪問者のアドレスとして
# Cloudflareのエッジが記録されます。ここで空にしているのは、転送ヘッダーが、追記すると
# 分かっているプロキシが前段に立つまではクライアントの与えた入力に過ぎないためです。
# GROOBB_TRUSTED_PROXIESがカンマ区切りの一覧 ("127.0.0.1,::1,10.0.0.0/8") で
# 上書きします。
port = 8080
trusted_proxies = []

[database]
# SQLiteデータベースファイルのパス。インスタンスが保持する状態はすべてこのファイルに
# あります。既定値を持たないのは、設定を誤ったインスタンスが自分で作った空のデータベースの
# 上で起動するのではなく、「データの在り処が分からない」と報告するためです。
# GROOBB_DATABASE_PATHが上書きします。
path = "/var/lib/groobb/groobb.sqlite"

[security]
# メール確認と2段階認証サインインの短命Cookieに署名する鍵。暗号学的に安全な
# 乱数源から32バイト以上を生成し (`openssl rand -base64 48`)、値は変えずに保ってください。
# 変更すると発行済みのトークンが無効になり、漏えいすると攻撃者が認証状態を偽造できます。
# GROOBB_CONTINUATION_TOKEN_KEYが上書きします。
continuation_token_key = ""

[email]
# 送信メールを配送するtransport ("resend" はResendのHTTP API、"smtp" はリレー)。
# "smtp" を指定することはメールを設定済みだという表明なので、その場合は下の [email.smtp]
# の設定を起動時に検証します。FromアドレスはSMTPでは必須です。エンベロープ送信者が空の
# メールはリレーに拒否されるためです。GROOBB_EMAIL_PROVIDER / GROOBB_EMAIL_FROM /
# GROOBB_EMAIL_FROM_NAME / GROOBB_RESEND_API_KEYが上書きします。
provider = "smtp"
from = "noreply@groobb.example.com"
from_name = "Groobb"
resend_api_key = ""

[email.smtp]
# 送信に使うリレー。上のproviderが "smtp" のときに使います。ポートに既定値が無いのは、
# 適切な値がTLSモードに従って決まり ("implicit" なら465、"starttls" なら587)、推測した
# 値は起動時ではなく配送時に失敗するためです。TLSモードは "starttls" / "implicit" / "none"
# のいずれかで、"none" が安全なのは信頼できるローカル経路に限られます (メールはサインインと
# パスワードリセットのリンクを運ぶため)。送信元アドレスで認可するリレーでは認証情報を空に、
# それ以外では両方を設定してください。hostをここで空にしているのは、このファイルをコピー
# しただけのインスタンスが、プレースホルダーのリレーで起動してワーカーのログにしか現れない
# 配送失敗を積むのではなく、設定名を挙げて起動時に止まるようにするためです。
# GROOBB_SMTP_HOST / GROOBB_SMTP_PORT / GROOBB_SMTP_USERNAME /
# GROOBB_SMTP_PASSWORD / GROOBB_SMTP_TLS_MODEが上書きします。
host = ""
port = 587
username = ""
password = ""
tls_mode = "starttls"

[turnstile]
# 公開フォームのBot対策に使うCloudflare Turnstileのキー。両方が空のときは
# ウィジェットを描画せずトークン検証もバイパスするため、キーを用意する前でもインスタンスは
# 起動します。無効化フラグは、開発・テスト環境でキーを未設定にせずTurnstileを切るための
# もので、本番では無視されます。GROOBB_TURNSTILE_SITE_KEY / GROOBB_TURNSTILE_SECRET_KEY /
# GROOBB_TURNSTILE_DISABLEが上書きします。
site_key = ""
secret_key = ""
disable = false

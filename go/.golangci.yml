# golangci-lint v2 configuration (minimal initial setup).
# https://golangci-lint.run/usage/configuration/
#
# [Ja] golangci-lint v2 の設定ファイル (初期は最小構成)。
# レイヤー依存ルール (depguard) などは Go アプリの構造が育つ後続フェーズで追加します。
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet # Go standard static analysis. [Ja] Go 標準の静的解析
    - staticcheck # advanced static analysis. [Ja] 高度な静的解析
    - errcheck # report unchecked errors. [Ja] 未チェックのエラーを検出
    - ineffassign # detect ineffectual assignments. [Ja] 無効な代入を検出
    - unused # detect unused code. [Ja] 未使用コードを検出
    - gosec # security checks. [Ja] セキュリティチェック

  exclusions:
    rules:
      # Test files exercise internal seams and fixtures, so skip gosec there.
      # depguard will join this list once the layer-dependency rules are
      # introduced in a later phase.
      #
      # [Ja] テストファイルは内部の継ぎ目やフィクスチャを扱うため gosec を無効化する。
      # depguard はレイヤー依存ルールを後続フェーズで導入した時点でこのリストに加える。
      - path: '(.+)_test\.go'
        linters:
          - gosec
      # templ-generated files are not hand-written, so exclude them from linters.
      # [Ja] templ 生成ファイルは手書きではないため、リンターの対象から除外する。
      - path: '(.+)_templ\.go'
        linters:
          - govet
          - staticcheck
          - gosec
          - errcheck
          - ineffassign
          - unused
    paths:
      - bin/.*
      - vendor/.*
      - static/.*
      - node_modules/.*

  settings:
    gosec:
      # Raise the gate to medium severity and confidence to match the sister
      # Korylus projects (Annict / Mewst / Wikino). This drops low-confidence
      # findings such as G101 on the hardcoded test-database DSN in
      # internal/testutil, which is a throwaway local/CI credential, not a secret.
      #
      # [Ja] severity / confidence をともに medium に上げ、姉妹 Korylus プロジェクト
      # (Annict / Mewst / Wikino) に揃える。これにより internal/testutil の
      # テスト用 DB DSN にハードコードされた認証情報に対する G101 のような低信頼度の
      # 指摘を除外する。これはローカル / CI 用の使い捨て認証情報であり秘密情報ではない。
      severity: medium
      confidence: medium

formatters:
  enable:
    - gofmt # standard Go formatting. [Ja] Go 標準フォーマット
    - goimports # organize imports. [Ja] import 文の整理
  exclusions:
    paths:
      - bin/.*
      - vendor/.*
      - static/.*
      - node_modules/.*
      - '(.+)_templ\.go' # templ-generated files. [Ja] templ 生成ファイル
  settings:
    goimports:
      # Group imports of this module separately from third-party packages.
      # [Ja] 本モジュールの import をサードパーティと分けてグループ化します。
      local-prefixes:
        - github.com/groobb/groobb/go

# golangci-lint v2の設定ファイル (初期は最小構成)。
# レイヤー依存ルール (depguard) などはGoアプリの構造が育つ後続フェーズで追加します。
# 参照: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet # Go標準の静的解析
    - staticcheck # 高度な静的解析
    - errcheck # 未チェックのエラーを検出
    - ineffassign # 無効な代入を検出
    - unused # 未使用コードを検出
    - gosec # セキュリティチェック

  exclusions:
    rules:
      # テストファイルは内部の継ぎ目やフィクスチャを扱うためgosecを無効化する。
      # depguardはレイヤー依存ルールを後続フェーズで導入した時点でこのリストに加える。
      - path: '(.+)_test\.go'
        linters:
          - gosec
      # templ生成ファイルは手書きではないため、リンターの対象から除外する。
      - path: '(.+)_templ\.go'
        linters:
          - govet
          - staticcheck
          - gosec
          - errcheck
          - ineffassign
          - unused
    paths:
      - bin/.*
      - vendor/.*
      - static/css/.*
      - static/js/.*
      - node_modules/.*

  settings:
    gosec:
      # severity / confidenceをともにmediumに上げ、姉妹Korylusプロジェクト
      # (Annict / Mewst / Wikino) に揃える。これによりinternal/testutilの、認証情報のように
      # 見える固定値 (TestContinuationTokenKey) に対するG101のような低信頼度の指摘を
      # 除外する。これらはテストが1つの非本番の値を共有するためだけに存在し、秘密情報では
      # ない。
      severity: medium
      confidence: medium
      # G120: r.FormValue / r.ParseFormのボディサイズ未制限の指摘。gosecは
      # 関数単位で検出するため、フォームを解析する箇所 (ここのCSRF / method-override
      # ミドルウェアや、後続フェーズの各フォームハンドラー) はすべて検出対象に残る。
      # リクエストボディサイズの上限は呼び出し箇所ごとに散らすのではなくサーバー /
      # ミドルウェア単位の1箇所に置くべきもので、HTTPサーバー配線時に追加する。
      # ここでG120を一括除外するのは姉妹Korylusプロジェクト (Annict / Mewst /
      # Wikino) に揃える措置で、各フォーム解析箇所にnolintを散在させるのを避ける。
      excludes:
        - G120

formatters:
  enable:
    - gofmt # Go標準フォーマット
    - goimports # import文の整理
  exclusions:
    paths:
      - bin/.*
      - vendor/.*
      - static/css/.*
      - static/js/.*
      - node_modules/.*
      - '(.+)_templ\.go' # templ生成ファイル
  settings:
    goimports:
      # 本モジュールのimportをサードパーティと分けてグループ化します。
      local-prefixes:
        - github.com/groobb/groobb/go
